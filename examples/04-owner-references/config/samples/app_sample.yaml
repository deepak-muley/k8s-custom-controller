apiVersion: ownership.examples.k8s.io/v1alpha1
kind: App
metadata:
  name: nginx-app
  namespace: default
spec:
  image: nginx:latest
  replicas: 2
  port: 80
---
apiVersion: ownership.examples.k8s.io/v1alpha1
kind: App
metadata:
  name: httpd-app
  namespace: default
spec:
  image: httpd:latest
  replicas: 3
  port: 8080
