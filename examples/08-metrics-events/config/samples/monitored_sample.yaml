apiVersion: metrics.examples.k8s.io/v1alpha1
kind: Monitored
metadata:
  name: monitored-sample
  namespace: default
spec:
  # Target resource to monitor
  target: "web-server"

  # Alert threshold (0-100)
  threshold: 75

  # Monitoring interval in seconds
  interval: 30
---
apiVersion: metrics.examples.k8s.io/v1alpha1
kind: Monitored
metadata:
  name: monitored-database
  namespace: default
spec:
  target: "postgres-db"
  threshold: 90
  interval: 60
---
apiVersion: metrics.examples.k8s.io/v1alpha1
kind: Monitored
metadata:
  name: monitored-cache
  namespace: default
spec:
  target: "redis-cache"
  threshold: 80
  interval: 15
