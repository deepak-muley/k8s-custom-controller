---
# Sample IndexedResource with category "database"
apiVersion: indexing.examples.k8s.io/v1alpha1
kind: IndexedResource
metadata:
  name: database-mysql
  namespace: default
spec:
  category: database
  owner: team-backend
  priority: 9
  tags:
    - mysql
    - relational
  data: "MySQL database configuration"
---
# Another database resource in the same category
apiVersion: indexing.examples.k8s.io/v1alpha1
