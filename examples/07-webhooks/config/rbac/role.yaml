---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - webhooks.examples.k8s.io
  resources:
  - validatedapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - webhooks.examples.k8s.io
  resources:
  - validatedapps/finalizers
  verbs:
  - update
- apiGroups:
  - webhooks.examples.k8s.io
  resources:
  - validatedapps/status
  verbs:
  - get
  - patch
  - update
