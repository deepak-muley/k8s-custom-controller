---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-webhooks-examples-k8s-io-v1alpha1-validatedapp
  failurePolicy: Fail
  name: mvalidatedapp.kb.io
  rules:
  - apiGroups:
    - webhooks.examples.k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - validatedapps
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-webhooks-examples-k8s-io-v1alpha1-validatedapp
  failurePolicy: Fail
  name: vvalidatedapp.kb.io
  rules:
  - apiGroups:
    - webhooks.examples.k8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - validatedapps
  sideEffects: None
