# KUTTL Test: Verify Controller Is Counting Resources
# This step verifies that the controller (installed via Helm) is counting resources correctly
#
# Note: This requires querying the controller's counting state.
# Options:
# 1. Check controller logs for count information
# 2. Query controller metrics endpoint (if exposed)
# 3. Use a test pod to exec into controller and query state
# 4. Check controller pod status and readiness

---
# Verify controller pod is running and ready
apiVersion: v1
kind: Pod
metadata:
  name: k8s-custom-controller
  namespace: kuttl-test-helm
  labels:
    app: k8s-custom-controller
status:
  phase: Running
  containerStatuses:
  - name: k8s-custom-controller
    ready: true
    state:
      running: {}

---
# Example: Use a test pod to query controller logs
# This is a simplified example - actual implementation would parse logs
apiVersion: v1
kind: Pod
metadata:
  name: verify-controller-count
  namespace: kuttl-test-helm
spec:
  containers:
  - name: kubectl
    image: bitnami/kubectl:latest
    command:
    - /bin/sh
    - -c
    - |
      echo "Verifying controller is running and counting resources..."
      
      # Wait for controller pod to be ready
      kubectl wait --for=condition=ready pod -l app=k8s-custom-controller -n kuttl-test-helm --timeout=60s
      
      # Check controller logs for counting activity
      # Note: This is a simplified example - actual implementation would parse logs more carefully
      echo "Checking controller logs..."
      kubectl logs -l app=k8s-custom-controller -n kuttl-test-helm --tail=50 | grep -i "count\|deployment" || {
        echo "Warning: Could not find count information in logs"
        exit 0  # Don't fail the test, just log a warning
      }
      
      # Verify controller is processing resources
      echo "✅ Controller appears to be running and processing resources"
      echo "Note: For actual count verification, controller needs to expose metrics/API or logs need to be parsed more carefully"
      
      sleep 10  # Give controller time to sync and count resources
  restartPolicy: Never
