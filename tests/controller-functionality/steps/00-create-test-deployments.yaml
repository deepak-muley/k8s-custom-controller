# Step 1: Create test deployments that the controller should count

apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment-1
  namespace: kuttl-test-controller
  labels:
    app: test
    test: kuttl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
